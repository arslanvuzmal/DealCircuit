version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: leadpilot-postgres
    restart: always
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot_password
      POSTGRES_DB: leadpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: leadpilot-mailpit
    restart: always
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP port

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: leadpilot-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
