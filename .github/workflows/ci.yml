name: LeadPilot AI CI

on:
  push:
    branches: [ main, antigravity/leadpilot-v1 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Prisma Schema & Database
        run: npx prisma db push

      - name: Seed Demo Database
        run: npm run db:seed

      - name: Run Type Check
        run: npm run type-check

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Run Next.js Production Build
        run: npm run build
        env:
          DEMO_MODE: "true"
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci_jwt_secret_key"
          INTERNAL_API_SECRET: "ci_internal_secret_key"
