name: LeadPilot AI CI

on:
  push:
    branches: [ main, fix/vercel-postgres-deployment, antigravity/leadpilot-v1 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leadpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Prisma Migrations (PostgreSQL)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/leadpilot_test"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/leadpilot_test"

      - name: Seed Demo Database
        run: npm run db:seed
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/leadpilot_test"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/leadpilot_test"
          ALLOW_PRODUCTION_SEED: "true"
          DEMO_MODE: "true"

      - name: Run Type Check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Run Next.js Production Build
        run: npm run build
        env:
          DEMO_MODE: "true"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/leadpilot_test"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/leadpilot_test"
          JWT_SECRET: "ci-only-long-random-secret-key-12345"
          INTERNAL_API_SECRET: "ci-only-long-internal-secret-key-12345"
